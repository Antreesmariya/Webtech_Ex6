<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moving Car</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .container {
            width: 650px;
            padding: 35px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .road {
            position: relative;
            height: 70px;
            border-bottom: 4px solid #555;
            margin-bottom: 25px;
            overflow: hidden;
        }

        #car {
            position: absolute;
            left: 0;
            bottom: 5px;
            font-size: 42px;
        }

        button {
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .move {
            background: #4CAF50;
            color: white;
        }

        .stop {
            background: #e74c3c;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Moving Car</h1>

        <div class="road">
            <span id="car">🚗</span>
        </div>

        <button class="move" onclick="moveCar()">Move</button>
        <button class="stop" onclick="stopCar()">Stop</button>

    </div>

    <script>

        var car;
        var movement;
        var position = 0;
        var direction = 1;

        function initialize() {
            car = document.getElementById("car");
        }

        function moveCar() {

            var road = document.querySelector(".road");

            var maxPosition = road.clientWidth - car.offsetWidth;

            position = position + (2 * direction);

            // When car reaches the right side
            if (position >= maxPosition) {
                position = maxPosition;
                direction = -1;
            }

            // When car reaches the left side
            if (position <= 0) {
                position = 0;
                direction = 1;
            }

            car.style.left = position + "px";

            movement = setTimeout(moveCar, 20);
        }

        function stopCar() {
            clearTimeout(movement);
        }

        window.onload = initialize;

    </script>

</body>

</html>
