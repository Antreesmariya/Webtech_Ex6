<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Font Size Changer</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Poppins", sans-serif;

            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .card {
            width: 450px;
            padding: 35px;
            text-align: center;

            background: #fff5f5;

            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(150, 50, 50, 0.25);
        }

        h1 {
            color: #c44569;
            margin-bottom: 25px;

            font-family: Georgia, serif;
        }

        #para1 {
            font-size: 17px;
            padding: 20px;

            background: #ffe4e6;
            color: #7b2d42;

            border-radius: 12px;

            cursor: pointer;

            transition: font-size 0.3s, background 0.3s;
        }

        #para1:hover {
            background: #ffcdd2;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Change Font Size</h1>

        <p id="para1"
           onmouseover="increaseSize()"
           onmouseout="decreaseSize()">

            Move your mouse over this paragraph to zoom in.

        </p>

    </div>

    <script>

        function increaseSize() {
            document.getElementById("para1").style.fontSize = "28px";
        }

        function decreaseSize() {
            document.getElementById("para1").style.fontSize = "17px";
        }

    </script>

</body>

</html>
